services:
  db:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_USER: at
      POSTGRES_PASSWORD: at
      POSTGRES_DB: at
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U at -d at"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://at:at@db:5432/at
    ports:
      - "8000:8000"
