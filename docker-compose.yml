services:
  db:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_USER: at
      POSTGRES_PASSWORD: at
      POSTGRES_DB: at
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U at -d at"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://at:at@db:5432/at
      REDIS_URL: redis://redis:6379
      APPLY_SCHEMA_ON_BOOT: "true"
    ports:
      - "8000:8000"

  worker:
    build: .
    command: ["/app/.venv/bin/arq", "src.workers.acquire.WorkerSettings"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://at:at@db:5432/at
      REDIS_URL: redis://redis:6379
